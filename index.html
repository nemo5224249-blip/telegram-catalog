    <title>Каталог</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#F5F3ED',
                            input: '#EBE8DF',
                            card: '#FFFFFF',
                            img: '#E9E6DF',
                            textDark: '#1A1A1A',
                            textGray: '#737373',
                            activeBtn: '#1A1A1A'
                        }
                    },
                    fontFamily: {
                        serif: ['Georgia', 'Times New Roman', 'serif'],
                        sans: ['Helvetica', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #F5F3ED; }

    </style>
</head>
<body class="bg-brand-bg text-brand-textDark font-sans antialiased min-h-screen flex flex-col">

            <div id="admin-panel-trigger"></div>
        </header>
        <main class="flex-1 flex flex-col">
            <div class="mb-4">
                <input type="text" id="search-input" placeholder="Поиск товаров..." class="w-full px-4 py-2 bg-brand-input rounded-lg border-none focus:ring-1 focus:ring-brand-textDark outline-none">
            </div>
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </main>
    </div>
    <div id="modal-container"></div>
